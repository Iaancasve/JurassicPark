<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Gestión de Usuarios - Jurassic Park</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1 text-warning">JURASSIC PARK</span>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ms-3">
                    <a class="nav-link" href="dashboard.html">Mapa</a>
                    <a class="nav-link" href="dinosaurios.html">Dinosaurios</a>
                    <a class="nav-link" href="celdas.html">Celdas</a>
                    <a class="nav-link active" href="usuarios.html">Usuarios</a>
                </div>
            </div>
            <div class="d-flex gap-2 align-items-center">
                <a class="nav-link text-white me-2" href="perfil.html">Mi perfil</a>
                <button id="logoutBtn" class="btn btn-outline-danger btn-sm">Cerrar Sesión</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Gestión de Personal</h2>
            <button class="btn btn-warning" id="btnNuevoUsuario">
                + Nuevo Empleado
            </button>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Nick (Usuario)</th>
                            <th>Rol</th>
                            <th>Fecha Registro</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaUsuarios">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div class="modal fade" id="userModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-warning">
                    <h5 class="modal-title" id="modalTitle">Nuevo Empleado</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="userForm">
                    <div class="modal-body">
                        <input type="hidden" id="userId">

                        <div class="mb-3">
                            <label class="form-label">Nick de Usuario</label>
                            <input type="text" id="userNick" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Contraseña</label>
                            <input type="password" id="userPassword" class="form-control">
                            <small class="text-muted" id="passHelp">Mínimo 8 caracteres.</small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Rol en el Parque</label>
                            <select id="userRole" class="form-select" required>
                                <option value="">Selecciona un rol...</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-warning">Guardar Empleado</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/src/components/userManager.ts"></script>
</body>

</html>
