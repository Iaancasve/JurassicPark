<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Mi Perfil - Jurassic Park</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1 text-warning">JURASSIC PARK</span>

            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ms-3">
                    <a class="nav-link" href="dashboard.html">Mapa</a>
                    <a class="nav-link d-none" id="nav-dinos" href="dinosaurios.html">Dinosaurios</a>
                    <a class="nav-link d-none" id="nav-celdas" href="celdas.html">Celdas</a>
                    <a class="nav-link d-none" id="nav-users" href="usuarios.html">Usuarios</a>
                </div>
            </div>

            <div class="d-flex gap-2 align-items-center">
                <a class="nav-link text-white me-2" href="perfil.html">Mi perfil</a>
                <button id="logoutBtn" class="btn btn-outline-danger btn-sm">Cerrar Sesión</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-white">
                        <h4 class="mb-0">Configuración de Cuenta</h4>
                    </div>
                    <div class="card-body">
                        <form id="profileForm">
                            <div class="mb-3">
                                <label class="form-label">Nombre de Usuario / Nick</label>
                                <input type="text" id="nick" class="form-control" required>
                            </div>
                            <div class="form-text">Nombre actual, cambialo si quieres</div>
                    </div>

                    <hr class="my-4">
                    <p class="text-muted small">Deja estos campos en blanco si no deseas cambiar tu contraseña.</p>

                    <div class="mb-3">
                        <label class="form-label">Nueva Contraseña</label>
                        <div class="input-group">
                            <input type="password" id="password" class="form-control" minlength="8">
                            <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                👁️
                            </button>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Confirmar Nueva Contraseña</label>
                        <div class="input-group">
                            <input type="password" id="password_confirmation" class="form-control">
                            <button class="btn btn-outline-secondary" type="button" id="toggleConfirm">
                                👁️
                            </button>
                        </div>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary">Actualizar Perfil</button>
                        <a href="dashboard.html" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="liveToast" class="toast align-items-center border-0" role="alert" aria-live="assertive"
            aria-atomic="true">
            <div class="d-flex">
                <div id="toastMessage" class="toast-body"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/src/components/profileManager.ts"></script>
</body>

</html>
