<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Gestión de Dinosaurios - Jurassic Park</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <span class="navbar-brand">Panel Administrativo - Dinosaurios</span>
            <a href="./dashboard.html" class="btn btn-outline-light btn-sm">Volver al Mapa</a>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Inventario de Dinosaurios</h2>
            <button id="btnNuevoDino" class="btn btn-primary">Registrar Nuevo Dino</button>
        </div>

        <div class="card shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Nombre (Nick)</th>
                            <th>Especie</th>
                            <th>Peligrosidad</th>
                            <th>Salud</th>
                            <th>Celda</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="listaDinos">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div class="modal fade" id="dinoModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Registrar Dinosaurio</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="dinoForm">
                    <div class="modal-body">
                        <input type="hidden" id="dinoId">
                        <div class="mb-3">
                            <label class="form-label">Nombre (Nick)</label>
                            <input type="text" id="nombre" class="form-control" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Especie</label>
                                <input type="text" id="especie" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Dieta</label>
                                <select id="dieta" class="form-select">
                                    <option value="Herbívoro">Herbívoro</option>
                                    <option value="Carnívoro">Carnívoro</option>
                                    <option value="Omnívoro">Omnívoro</option>
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Peligrosidad</label>
                                <select id="peligrosidad" class="form-select">
                                    <option value="Bajo">Bajo</option>
                                    <option value="Medio">Medio</option>
                                    <option value="Alto">Alto</option>
                                    <option value="Muy Alto">Muy Alto</option>
                                    <option value="Extremo">Extremo</option>
                                    <option value="Crítico">Crítico</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Salud</label>
                                <select id="estado_salud" class="form-select">
                                    <option value="Excelente">Excelente</option>
                                    <option value="Bueno">Bueno</option>
                                    <option value="Enfermo">Enfermo</option>
                                    <option value="Crítico">Crítico</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Asignar a Celda (ID)</label>
                            <input type="number" id="celda_id" class="form-control" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar Dinosaurio</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/src/components/dinoManager.ts"></script>
</body>

</html>
