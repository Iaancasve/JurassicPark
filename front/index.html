<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <div id="app" class="container vh-100 d-flex align-items-center justify-content-center">
    <div class="card p-4 shadow-lg" style="width: 24rem;">
      <div class="text-center mb-4">
        <h2 class="fw-bold">Jurassic Park</h2>
        <p class="text-muted">Inicia sesión para gestionar el parque</p>
      </div>
      <form id="loginForm">
        <div class="mb-3">
          <label for="nick" class="form-label">Nick del empleado</label>
          <input type="text" class="form-control" id="nick" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Entrar al Parque</button>
      </form>
      <div id="errorMsg" class="alert alert-danger mt-3 d-none"></div>
    </div>
  </div>


  <script type="module" src="/src/main.ts"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
